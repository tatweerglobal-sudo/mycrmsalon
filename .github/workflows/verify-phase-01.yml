name: Verify My CRM Salon SaaS Production CI

on:
  push:
    branches:
      - main
      - feature/beauty-saas-foundation
  pull_request:
    branches:
      - main
      - feature/beauty-saas-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout My CRM Salon repository
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: ESLint check
        run: npm run lint

      - name: Unit and PostgreSQL Multi-Tenant Integration Tests
        run: npm test

      - name: Next.js Production Build
        run: npm run build
