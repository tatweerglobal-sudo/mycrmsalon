name: Daily Database & Code Backup to Google Drive

on:
  schedule:
    # Runs every day at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      retention_days:
        description: 'Number of days to keep backups in Google Drive'
        required: false
        default: '30'

concurrency:
  group: daily-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Backup Neon DB & Source Code to Google Drive
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth

      - name: Create Database Dump & Source Code Archive
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED || secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not configured in GitHub repository secrets!"
            exit 1
          fi

          TIMESTAMP=$(date -u +"%Y-%m-%d_%H%M%S")
          DB_BACKUP_FILE="mycrmsalon_backup_${TIMESTAMP}.sql.gz"
          CODE_BACKUP_FILE="mycrmsalon_code_${TIMESTAMP}.zip"

          echo "1. Starting database dump to ${DB_BACKUP_FILE}..."
          pg_dump "$DATABASE_URL" --no-owner --no-acl --clean --if-exists | gzip > "${DB_BACKUP_FILE}"
          echo "Database dump complete. Size: $(du -h ${DB_BACKUP_FILE} | cut -f1)"

          echo "2. Starting source code archiving to ${CODE_BACKUP_FILE}..."
          git archive --format=zip -o "${CODE_BACKUP_FILE}" HEAD
          echo "Code archive complete. Size: $(du -h ${CODE_BACKUP_FILE} | cut -f1)"

          echo "DB_BACKUP_FILE=${DB_BACKUP_FILE}" >> $GITHUB_ENV
          echo "CODE_BACKUP_FILE=${CODE_BACKUP_FILE}" >> $GITHUB_ENV

      - name: Upload Both Backups to Google Drive
        env:
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_SERVICE_ACCOUNT_KEY: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          RETENTION_DAYS: ${{ github.event.inputs.retention_days || '30' }}
        run: |
          python3 scripts/backup_to_gdrive.py "${DB_BACKUP_FILE}" "${CODE_BACKUP_FILE}"

      - name: Upload Backups as GitHub Artifacts (Fallback)
        uses: actions/upload-artifact@v4
        with:
          name: mycrmsalon-daily-backups
          path: |
            ${{ env.DB_BACKUP_FILE }}
            ${{ env.CODE_BACKUP_FILE }}
          retention-days: 3
