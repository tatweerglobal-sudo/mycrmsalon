name: Verify My CRM Salon preview

on:
  push:
    branches:
      - feature/beauty-saas-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout My CRM Salon only
        uses: actions/checkout@v4
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install preview dependencies
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: ESLint check
        run: npm run lint
      - name: Unit and PostgreSQL Integration Tests
        run: npm test
      - name: Next.js Production Build
        run: npm run build
